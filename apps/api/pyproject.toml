[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cataloging-api"
version = "0.1.0"
description = "Read-only DSpace synchronization and cataloguing assistance API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=0.69,<1",
  "cryptography>=44,<46",
  "fastapi>=0.116,<1",
  "openai>=1.60,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<2.1",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cataloging_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
