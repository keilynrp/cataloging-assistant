services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cataloging
      POSTGRES_USER: cataloging
      POSTGRES_PASSWORD: cataloging
    ports:
      - "5433:5432"
    volumes:
      - cataloging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cataloging -d cataloging"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cataloging:cataloging@postgres:5432/cataloging
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      CATALOG_API_URL: http://api:8000
      CATALOG_REVIEW_TOKEN: ${CATALOG_REVIEW_TOKEN}
      NEXT_PUBLIC_CATALOG_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  cataloging_postgres:
