services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cataloging}
      POSTGRES_USER: ${POSTGRES_USER:-cataloging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cataloging}
    volumes:
      - cataloging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cataloging:cataloging@postgres:5432/cataloging}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_CATALOG_API_URL: ${NEXT_PUBLIC_CATALOG_API_URL:-http://localhost:8000}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CATALOG_API_URL: ${CATALOG_API_URL:-http://api:8000}
      CATALOG_REVIEW_TOKEN: ${CATALOG_REVIEW_TOKEN}
      NEXT_PUBLIC_CATALOG_API_URL: ${NEXT_PUBLIC_CATALOG_API_URL:-http://localhost:8000}
    expose:
      - "3000"
    depends_on:
      - api

volumes:
  cataloging_postgres:
